# Project Dex - three interface layers.
#
#   teller  : the synthetic legacy app the agent drives. Open, because all of its
#             data is fabricated and it is meant to be clicked around freely.
#   console : operator console. Authenticated - it can take control of a live
#             browser session, which is not something to leave open on a public name.
#   api     : capability catalog / replay API. Authenticated for the same reason.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80;
    listen [::]:80;
    server_name teller.dexdash.cloud console.dexdash.cloud api.dexdash.cloud;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------- teller
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name teller.dexdash.cloud;

    ssl_certificate     /etc/letsencrypt/live/dexdash.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dexdash.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # A fake bank console should never end up in a search index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }
}

# ---------------------------------------------------------------- console
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name console.dexdash.cloud;

    ssl_certificate     /etc/letsencrypt/live/dexdash.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dexdash.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    auth_basic           "Project Dex operator console";
    auth_basic_user_file /etc/nginx/.dex_htpasswd;

    root /var/www/dex/app;
    index index.html;
    # BrowserRouter: unknown paths are client routes, not 404s.
    location / { try_files $uri $uri/ /index.html; }

    # The API and the screencast socket live on the same origin, so the console
    # needs no CORS story and the browser treats the WebSocket as first-party.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4000;
    }
    location /ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:4000;
    }
}

# ---------------------------------------------------------------- api
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.dexdash.cloud;

    ssl_certificate     /etc/letsencrypt/live/dexdash.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dexdash.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    auth_basic           "Project Dex API";
    auth_basic_user_file /etc/nginx/.dex_htpasswd;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4000;
    }
}
