# dexdash.cloud - the public explainer. Same build as the console; nginx just
# serves a different index file.

server {
    listen 80;
    listen [::]:80;
    server_name dexdash.cloud www.dexdash.cloud n8n.dexdash.cloud;
    return 301 https://dexdash.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dexdash.cloud www.dexdash.cloud;
    ssl_certificate     /etc/letsencrypt/live/dexdash.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dexdash.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    root /var/www/dex/app;
    index site.html;

    # Unauthenticated, read-only counts so the landing page can show real status.
    # Deliberately only /api/stats: nothing here can invoke or control anything.
    location = /api/status {
        proxy_pass http://127.0.0.1:4000/api/stats;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /site.html;
    }
}

# Retired subdomain from the previous project.
server {
    listen 443 ssl;
    server_name n8n.dexdash.cloud;
    ssl_certificate     /etc/letsencrypt/live/dexdash.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dexdash.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    return 410;
}
